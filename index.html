<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Le sélecteur des noms</title>
</head>
<body>
    <h1 id="titre">Bienvenue dans le sélecteur de noms aléatoires</h1>
    <div>
    <input type="text" placeholder="veuillez entrer un nom" id="ecrireNom">
    <button onclick="ajouterNom()" id="ajouter">Ajouter</button>
    </div>
    <div>
        <ul id="stockerNom">
            
        </ul>
    </div>
    <button onclick="choisirNomAleatoireAfficherPopup()" id="choisir">choisir un nom</button>
    <div id="popup" >
        <p id="message"></p>
        <button onclick="masquerPopup()" id="suivant">Suivant</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
